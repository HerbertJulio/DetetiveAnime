<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<radialGradient id="bg" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#221624"/><stop offset=".6" stop-color="#110C14"/><stop offset="1" stop-color="#07060A"/></radialGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3A3"/><stop offset=".45" stop-color="#F4B04A"/><stop offset="1" stop-color="#E5484D"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset=".45" stop-color="#F2B544" stop-opacity=".28"/><stop offset="1" stop-color="#F2B544" stop-opacity="0"/></radialGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A8102A"/><stop offset=".35" stop-color="#E5293F"/><stop offset=".6" stop-color="#D21C33"/><stop offset="1" stop-color="#8E0C22"/></linearGradient>
<linearGradient id="redv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0384D"/><stop offset="1" stop-color="#A30F27"/></linearGradient>
<mask id="cut"><rect width="512" height="512" fill="#fff"/>
<rect x="0" y="292" width="512" height="5" fill="#000"/><rect x="0" y="312" width="512" height="8" fill="#000"/><rect x="0" y="334" width="512" height="11" fill="#000"/><rect x="0" y="358" width="512" height="15" fill="#000"/></mask>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B544" stop-opacity=".22"/><stop offset="1" stop-color="#F2B544" stop-opacity="0"/></linearGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#F2B544" stroke-opacity=".14" stroke-width="2"/>
<!-- estrelas -->
<g fill="#FFE3A3"><circle cx="96" cy="96" r="2.2" opacity=".8"/><circle cx="420" cy="86" r="1.8" opacity=".7"/><circle cx="446" cy="160" r="1.4" opacity=".6"/><circle cx="70" cy="190" r="1.4" opacity=".5"/><circle cx="380" cy="120" r="1.2" opacity=".5"/></g>
<!-- sol -->
<circle cx="256" cy="268" r="168" fill="url(#halo)"/>
<circle cx="256" cy="268" r="118" fill="url(#sun)" mask="url(#cut)"/>
<!-- horizonte e reflexo -->
<path d="M70 400 H442" stroke="#F2B544" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
<path d="M150 412 H362 M190 424 H322 M224 436 H288" stroke="url(#fade)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
<path d="M136 412 H376" stroke="#F2B544" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
<path d="M188 426 H324" stroke="#F2B544" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"/>
<!-- torii -->
<g>
<!-- pilares levemente afunilados -->
<path d="M168 178 H194 L198 392 H162Z" fill="url(#red)"/>
<path d="M318 178 H344 L350 392 H314Z" fill="url(#red)"/>
<rect x="156" y="384" width="48" height="16" rx="3" fill="#1A0A10"/><rect x="308" y="384" width="48" height="16" rx="3" fill="#1A0A10"/>
<!-- nuki (viga de baixo) -->
<rect x="126" y="214" width="260" height="17" rx="2" fill="url(#redv)"/>
<!-- gakuzuka (placa) -->
<rect x="243" y="172" width="26" height="44" rx="2" fill="url(#redv)"/>
<rect x="248" y="180" width="16" height="28" rx="1.5" fill="#1A0A10"/>
<!-- shimaki -->
<path d="M110 160 H402 L396 178 H116Z" fill="url(#redv)"/>
<!-- kasagi (topo curvado com pontas para cima) -->
<path d="M70 124 Q256 154 442 124 L436 146 Q256 172 76 146Z" fill="#1A0A10"/>
<path d="M78 140 Q256 168 434 140 L428 160 Q256 182 84 160Z" fill="url(#redv)"/>
<path d="M76 146 Q256 172 436 146" fill="none" stroke="#FF6B78" stroke-opacity=".55" stroke-width="2"/>
</g>
</svg>
